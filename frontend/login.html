<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Ivory Trust Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .center-wrap {
    max-width: 380px;
    margin: 0 auto;
    padding: 80px 24px 40px;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 40px;
  }
  .brand .mark {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 15px;
  }
  .brand .name { font-size: 16px; font-weight: 600; }

  h1 { font-size: 20px; margin: 0 0 6px; }
  .sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 28px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  input {
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.03em;
  }

  .btn.login { width: 100%; padding: 12px; font-size: 14px; margin-top: 6px; }

  .error-box {
    display: none;
    background: var(--block-dim);
    border: 1px solid var(--block);
    color: var(--block);
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .error-box.show { display: block; }

  .demo-hint {
    margin-top: 32px;
    padding: 14px 16px;
    border: 1px dashed var(--text-faint);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .demo-hint .title { font-family: 'IBM Plex Mono', monospace; color: var(--text-secondary); margin-bottom: 8px; }
  .demo-hint .row { padding: 3px 0; }
  .demo-hint .mono { color: var(--text-secondary); }

  .back-link { color: var(--text-muted); font-size: 12px; text-decoration: none; }
</style>
</head>
<body>

  <div class="center-wrap">
    <div class="brand">
      <div class="mark">IT</div>
      <div class="name">Ivory Trust Bank</div>
    </div>

    <h1>Log in</h1>
    <p class="sub">Enter your account number and PIN to continue.</p>

    <div class="error-box" id="error-box"></div>

    <form id="login-form">
      <div class="field">
        <label for="account-input">Account number</label>
        <input type="text" id="account-input" placeholder="C100000001" required autocomplete="off">
      </div>
      <div class="field">
        <label for="pin-input">PIN</label>
        <input type="password" id="pin-input" placeholder="••••" inputmode="numeric" maxlength="4" required>
      </div>
      <button type="submit" class="btn primary login" id="login-btn">Log in</button>
    </form>

    <div class="demo-hint">
      <div class="title">DEMO CREDENTIALS</div>
      <div class="row">Ada Obi — <span class="mono">C100000001</span> / PIN <span class="mono">1234</span></div>
      <div class="row">Chika Eze — <span class="mono">C100000003</span> / PIN <span class="mono">1234</span></div>
      <div class="row">Efe Okafor — <span class="mono">C100000005</span> / PIN <span class="mono">1234</span></div>
      <div class="row">Ngozi Adeyemi — <span class="mono">C100000006</span> / PIN <span class="mono">1234</span></div>
    </div>

    <p style="margin-top:24px;"><a href="index.html" class="back-link">← Back to home</a></p>
  </div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const accountId = document.getElementById('account-input').value.trim();
  const pin = document.getElementById('pin-input').value.trim();
  const errorBox = document.getElementById('error-box');
  const loginBtn = document.getElementById('login-btn');

  errorBox.classList.remove('show');
  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in…';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({account_id: accountId, pin: pin}),
    });
    const body = await res.json();
    if (!res.ok) {
      errorBox.textContent = body.message || 'Login failed.';
      errorBox.classList.add('show');
      return;
    }
    sessionStorage.setItem('ivorytrust_session', JSON.stringify(body));
    window.location.href = 'customer.html';
  } catch (err) {
    errorBox.textContent = 'Could not reach the server. Is the backend running?';
    errorBox.classList.add('show');
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Log in';
  }
});
</script>

</body>
</html>
